<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모션 게임 아케이드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0b1a;
      --panel: #17142b;
      --line: #2c2750;
      --text: #f4f1ff;
      --muted: #a9a3c7;
      --display: 'Black Han Sans', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text); font-family: var(--body);
      background:
        radial-gradient(circle at 15% 0%, rgba(255, 90, 140, 0.18), transparent 40%),
        radial-gradient(circle at 90% 20%, rgba(60, 170, 255, 0.16), transparent 45%),
        var(--bg);
    }
    main { max-width: 1080px; margin: 0 auto; padding: 48px 20px 60px; }

    header { margin-bottom: 36px; }
    h1 {
      font-family: var(--display); font-weight: 400; margin: 0;
      font-size: clamp(44px, 9vw, 88px); line-height: 1; letter-spacing: 1px;
    }
    h1 .glow { color: #ffe066; text-shadow: 0 0 24px rgba(255, 224, 102, 0.45); }
    .intro { color: var(--muted); font-size: 17px; margin: 14px 0 0; max-width: 60ch; line-height: 1.6; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

    .card {
      position: relative; display: flex; flex-direction: column; min-height: 250px;
      background: var(--panel); border: 2px solid var(--line); border-radius: 20px;
      padding: 24px; text-decoration: none; color: inherit; overflow: hidden;
      transition: transform .15s, border-color .15s;
    }
    .card::before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: var(--accent);
    }
    .card .icon {
      position: absolute; right: 16px; top: 16px; font-size: 52px; line-height: 1;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.4));
    }
    .card h2 {
      font-family: var(--display); font-weight: 400; font-size: 28px; margin: 18px 70px 10px 0;
      color: var(--accent); line-height: 1.15;
    }
    .card p { margin: 0; color: var(--muted); line-height: 1.65; font-size: 15px; max-width: 42ch; }
    .card .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 18px; }
    .tag {
      font-size: 13px; padding: 4px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.07); color: #d9d4f2;
    }
    .play {
      margin-left: auto; font-family: var(--display); font-size: 18px;
      background: var(--accent); color: #140f24; padding: 6px 16px; border-radius: 10px;
    }
    a.card:hover { transform: translateY(-4px); border-color: var(--accent); }
    a.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .card.soon { opacity: .55; cursor: default; }
    .card.soon .play { background: #3a3560; color: #bbb4df; }

    .tips {
      margin-top: 36px; background: rgba(255,255,255,0.04); border: 1px solid var(--line);
      border-radius: 16px; padding: 20px 24px; line-height: 1.8; font-size: 15px; color: #d9d4f2;
    }
    .tips h3 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0 0 8px; color: var(--text); }
    .tips p { margin: 0; }

    .topbar { display: flex; justify-content: flex-end; margin-bottom: 18px; }
    .teacher-btn {
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
      font-size: 18px; font-weight: 700; color: #ffe066;
      padding: 10px 20px; border: 2px solid #ffe066; border-radius: 999px;
      background: rgba(255, 224, 102, 0.08); transition: background .15s;
    }
    .teacher-btn:hover { background: rgba(255, 224, 102, 0.18); }
    .teacher-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } a.card:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <div class="topbar"><a class="teacher-btn" href="admin/">🔑 선생님 메뉴</a></div>
    <header>
      <h1>모션 게임 <span class="glow">아케이드</span></h1>
      <p class="intro">카메라 앞에서 몸을 움직여 즐기는 게임 모음이에요. 하고 싶은 게임을 눌러 시작하세요.</p>
    </header>

    <section class="grid" id="game-list" aria-label="게임 목록"></section>

    <section class="tips">
      <h3>시작 전에 확인하세요</h3>
      <p>🖥️ Chrome 브라우저에서 여는 것을 추천해요.</p>
      <p>📷 처음 들어가면 카메라 허용 팝업이 떠요. <b>사이트에 있는 동안 허용</b>을 누르면 다른 게임에서도 다시 묻지 않아요.</p>
      <p>📏 발까지 인식하는 게임은 발끝까지 화면에 보이도록 카메라에서 2.5~3m 떨어져 서세요.</p>
      <p>💡 얼굴 쪽이 밝게 비치는 곳이 인식이 잘 돼요. 창문을 등지고 서지 마세요.</p>
    </section>
  </main>

  <script>
    // ============================================================
    // 게임 목록: 여기만 고치면 메인 화면이 바뀝니다
    //   folder : 게임 폴더 이름 (그 폴더 안에 index.html)
    //   ready  : false면 "준비 중"으로 표시되고 눌리지 않아요
    // ============================================================
    const GAMES = [
      {
        title: '잉카 vs 스페인',
        desc: '장풍을 쏘고 방패로 막는 2인 격투 게임. 스쿼트 5번이면 상대 머리 위로 벼락이 떨어져요.',
        folder: 'inca',
        icon: '⚔️',
        color: '#f5b700',
        tags: ['2인용', '격투'],
        ready: true
      },
      {
        title: '잉카 vs 스페인 달리기',
        desc: '잉카 원주민과 스페인군의 2인 달리기 대결! 하늘에서 떨어지는 얼음, 방귀, 왕관, 부스트 아이템을 피하거나 맞추세요.',
        folder: 'running',
        icon: '🦙',
        color: '#4ecdc4',
        tags: ['2인용', '달리기', '아이템'],
        ready: true
      },
      {
        title: '손 터치 숫자 게임',
        desc: '화면에 나타나는 숫자를 1→2→3→4 순서대로 손으로 터치하세요. 제한 시간은 2분!',
        folder: 'touch',
        icon: '🖐️',
        color: '#ff6b9d',
        tags: ['1인용', '순발력'],
        ready: true
      },
      {
        title: '발로 밟기 게임',
        desc: '위에서 내려오는 블럭을 기준선에 맞춰 양발로 밟아요. 정확할수록 점수가 높아요.',
        folder: 'pump',
        icon: '👟',
        color: '#8b7bff',
        tags: ['1인용', '리듬'],
        ready: true
      }
    ];

    const list = document.getElementById('game-list');
    GAMES.forEach(g => {
      const el = document.createElement(g.ready ? 'a' : 'div');
      el.className = 'card' + (g.ready ? '' : ' soon');
      el.style.setProperty('--accent', g.color);
      if (g.ready) el.href = g.folder + '/';
      else el.setAttribute('aria-disabled', 'true');

      const tags = g.tags.map(t => `<span class="tag">${t}</span>`).join('');
      el.innerHTML = `
        <span class="icon" aria-hidden="true">${g.icon}</span>
        <h2>${g.title}</h2>
        <p>${g.desc}</p>
        <div class="tags">${tags}<span class="play">${g.ready ? '시작하기' : '준비 중'}</span></div>
      `;
      list.appendChild(el);
    });
  </script>
</body>
</html>
